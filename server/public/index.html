<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Poker Tournament</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="header-content">
        <h1 class="title">Claude Poker Tournament</h1>
        <div class="game-info">
          <span class="hand-number" id="handNumber">Hand: 0</span>
          <span class="phase-indicator" id="phase">Waiting...</span>
          <button id="startButton" class="btn-start">Start Game</button>
        </div>
      </div>
    </header>

    <main class="main-layout">
      <section class="table-section">
        <div class="poker-table">
          <div class="table-felt">
            <!-- Player slots positioned around table -->
            <div class="player-slot player-pos-1" id="player-0" data-position="1">
              <div class="player-card">
                <div class="player-name">Waiting...</div>
                <div class="player-chips">—</div>
                <div class="player-status"></div>
                <div class="player-cards">
                  <span class="card card-hidden"></span>
                  <span class="card card-hidden"></span>
                </div>
              </div>
            </div>

            <div class="player-slot player-pos-2" id="player-1" data-position="2">
              <div class="player-card">
                <div class="player-name">Waiting...</div>
                <div class="player-chips">—</div>
                <div class="player-status"></div>
                <div class="player-cards">
                  <span class="card card-hidden"></span>
                  <span class="card card-hidden"></span>
                </div>
              </div>
            </div>

            <div class="player-slot player-pos-3" id="player-2" data-position="3">
              <div class="player-card">
                <div class="player-name">Waiting...</div>
                <div class="player-chips">—</div>
                <div class="player-status"></div>
                <div class="player-cards">
                  <span class="card card-hidden"></span>
                  <span class="card card-hidden"></span>
                </div>
              </div>
            </div>

            <div class="player-slot player-pos-4" id="player-3" data-position="4">
              <div class="player-card">
                <div class="player-name">Waiting...</div>
                <div class="player-chips">—</div>
                <div class="player-status"></div>
                <div class="player-cards">
                  <span class="card card-hidden"></span>
                  <span class="card card-hidden"></span>
                </div>
              </div>
            </div>

            <div class="player-slot player-pos-5" id="player-4" data-position="5">
              <div class="player-card">
                <div class="player-name">Waiting...</div>
                <div class="player-chips">—</div>
                <div class="player-status"></div>
                <div class="player-cards">
                  <span class="card card-hidden"></span>
                  <span class="card card-hidden"></span>
                </div>
              </div>
            </div>

            <!-- Center area -->
            <div class="table-center">
              <div class="pot-display">
                <div class="pot-label">Pot</div>
                <div class="pot-amount" id="potAmount">$0</div>
              </div>
              <div class="community-cards" id="communityCards">
                <span class="card card-empty"></span>
                <span class="card card-empty"></span>
                <span class="card card-empty"></span>
                <span class="card card-empty"></span>
                <span class="card card-empty"></span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <aside class="commentary-section">
        <div class="commentary-header">
          <h2>Live Commentary</h2>
        </div>
        <div class="commentary-feed" id="commentaryFeed">
          <div class="commentary-item system-message">
            <strong>System:</strong> Waiting for players to join...
          </div>
        </div>
      </aside>
    </main>

    <div class="winner-overlay" id="winnerOverlay">
      <div class="winner-modal">
        <h1 class="winner-title">Tournament Winner!</h1>
        <div class="winner-name" id="winnerName">Player Name</div>
        <div class="winner-chips" id="winnerChips">Final Chips</div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
